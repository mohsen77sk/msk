<div class="page-layout grid-scroll">
  <!-- Header -->
  <div class="header" *transloco="let t">
    <div class="search-container">
      <div class="msk-mat-search-bar">
        <mat-icon>search</mat-icon>
        <input [formControl]="search" autocomplete="off" [placeholder]="t('expenses.search')" />
      </div>
      <msk-sort-menu [sortData]="sortData" [sortItems]="sortItems" />
    </div>
  </div>

  <!-- Main -->
  <div class="content">
    <!-- List -->
    <cdk-virtual-scroll-viewport class="content-grid" #gridContent [itemSize]="72">
      <!-- Rows -->
      <div
        class="content-grid-item tow-line"
        [class.pointer-events-none]="!expense"
        *cdkVirtualFor="let expense of dataSource; trackBy: trackById"
        [routerLink]="['card', 'view', $safeNavigationMigration(expense?.id)]"
        matRipple
      >
        @if (expense) {
          <!-- Content -->
          <div class="content-grid-item-content">
            <div class="truncate">{{ expense.description || ('expenses.details.no-description' | transloco) }}</div>
            <div class="truncate">
              <span>{{ expense.category?.name || ('expenses.no-category' | transloco) }}</span>
              <span>{{ expense.cost | mskCurrency }}</span>
            </div>
          </div>
          <!-- End -->
          <div class="content-grid-item-end">
            <div class="truncate">{{ expense.date | mskDateTime: 'relative' }}</div>
          </div>
        } @else {
          <div class="content-grid-item-content">
            <div class="skeleton skeleton-text skeleton-text-lg"></div>
            <div class="skeleton skeleton-text skeleton-text-sm"></div>
          </div>
        }
      </div>
    </cdk-virtual-scroll-viewport>

    <!-- Empty state -->
    @if (dataSource.length === 0) {
      <msk-empty-state class="inset-0 h-full w-full"></msk-empty-state>
    }

    <!-- Fab -->
    <div class="content-fab-container">
      <button matFab extended [routerLink]="['card', 'new']" [mskFabExtendedCollapse]="gridContent">
        <mat-icon>add</mat-icon>
        <span *transloco="let t">{{ t('new') }}</span>
      </button>
    </div>
  </div>
</div>

<!-- Invisible router-outlet for card component -->
<div class="pointer-events-none invisible absolute h-0 w-0 opacity-0">
  <router-outlet></router-outlet>
</div>
