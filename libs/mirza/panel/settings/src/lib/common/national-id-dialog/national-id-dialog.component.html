<h2 matDialogTitle *transloco="let t; prefix: 'settings'">{{ t('national-id') }}</h2>

<div matDialogContent>
  <form class="flex flex-auto flex-col gap-y-2" [formRoot]="form" #formNode>
    <!-- Alert -->
    @if (alert()) {
      <msk-alert class="mb-4" [appearance]="'outline'" [showIcon]="false" [type]="alert()?.type ?? 'error'">
        {{ alert()?.message }}
      </msk-alert>
    }

    <!-- National Id -->
    <mat-form-field *transloco="let t; prefix: 'settings'">
      <mat-label>{{ t('national-id') }}</mat-label>
      <input matInput [formField]="form.nationalId" autocomplete="off" />
      <mat-error [mskFormFieldError]="form.nationalId"></mat-error>
    </mat-form-field>
  </form>
</div>

<div matDialogActions *transloco="let t">
  <button matButton type="button" [disabled]="form().submitting()" matDialogClose="cancelled">
    {{ t('cancel') }}
  </button>
  <button
    matButton
    type="submit"
    [disabled]="form().submitting()"
    [mskSpinner]="form().submitting()"
    (click)="formNode.requestSubmit()"
  >
    {{ form().submitting() ? '' : t('save') }}
  </button>
</div>
