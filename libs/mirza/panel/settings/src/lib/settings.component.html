<div class="page-layout content-scroll">
  <div class="header min-h-16 border-b" *transloco="let t; prefix: 'settings'">
    <div class="text-headline-small">{{ t('title') }}</div>
  </div>

  <div class="content">
    <div class="mx-auto w-full max-w-md">
      <div class="msk-list mt-4" *transloco="let t; prefix: 'settings'">
        <div class="text-title-large mb-8">{{ t('general-info') }}</div>
        <div class="msk-group-list">
          <button class="msk-list-item item-hover" matRipple (click)="uploadImage.click()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">photo_camera</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('profile-picture') }}</span>
            </div>
            <div class="relative!" [mskSpinner]="isLogoUploading()">
              <msk-avatar
                [class.opacity-20]="isLogoUploading()"
                [name]="currentStore()?.name ?? ''"
                [imageUrl]="currentStore()?.logoUrl"
                size="big"
              ></msk-avatar>
              <input #uploadImage hidden type="file" accept="image/*" (change)="uploadCurrentStoreLogo($event)" />
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openNameDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">assignment_ind</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('name') }}</span>
              <span>{{ currentStore()?.name || '-' }}</span>
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openNationalIdDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">id_card</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('national-id') }}</span>
              <span>{{ currentStore()?.nationalId || '-' }}</span>
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openEconomicCodeDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">medical_information</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('economic-code') }}</span>
              <span>{{ currentStore()?.economicCode || '-' }}</span>
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openPhoneDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">call</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('phone') }}</span>
              <span>{{ currentStore()?.phone || '-' }}</span>
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openPostalCodeDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">home_pin</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('postal-code') }}</span>
              <span>{{ currentStore()?.postalCode || '-' }}</span>
            </div>
          </button>
          <button class="msk-list-item item-hover" matRipple (click)="openAddressDialog()">
            <div class="msk-list-item-icon">
              <mat-icon class="mat-icon-rtl-mirror">home</mat-icon>
            </div>
            <div class="msk-list-item-content">
              <span>{{ t('address') }}</span>
              <span>{{ currentStore()?.address || '-' }}</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
